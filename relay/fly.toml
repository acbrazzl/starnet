# StarNet Remote relay — DEPLOYED 2026-09-30 as Fly app starnet-relay at https://remote.starnetos.com (DNS-only A/AAAA in
# Cloudflare + a Fly cert). Deploy with --ha=false: the routing table lives in one process, so it must be ONE machine.
# One small always-on machine: phones and stations hold WebSockets open, so nothing may auto-stop it.
app = "starnet-relay"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 10

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  # count CONNECTIONS, not requests: every phone and station is one long-lived socket
  [http_service.concurrency]
    type = "connections"
    soft_limit = 4000
    hard_limit = 5000

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
